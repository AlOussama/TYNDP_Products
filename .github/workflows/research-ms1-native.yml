name: MS1 pinned native mathspec research
on:
  pull_request:
    branches:
      - research/bundle-ml-04a-r2-reference-closure-2026-11-25
    paths:
      - 'Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1/**'
      - '.github/workflows/research-ms1-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'research/bundle-ml-04a-ms1-mathspec-reuse-2026-11-26'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: energy-models/mathspec
          ref: 5f1464c334c1012cdee2947d4d55b4d1d6bef40a
          path: mathspec-src
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source identities
        working-directory: mathspec-src
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = 5f1464c334c1012cdee2947d4d55b4d1d6bef40a
          git hash-object src/mathspec/_canonical.py
          test "$(git hash-object src/mathspec/_canonical.py)" = a8487b60f03839fc622834ffcaf76e1f9c99f6e9
          test "$(git hash-object pixi.lock)" = dcf89e3e6b3794a1ae79d00a07978ceaec37daba
          sha256sum pixi.lock pyproject.toml LICENSE src/mathspec/_canonical.py
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          manifest-path: mathspec-src/pixi.toml
          environments: py313
          locked: true
          cache: false
      - name: Native bounded probes (not original full-chain tests)
        working-directory: mathspec-src
        run: |
          pixi --version
          pixi run --locked -e py313 python --version
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1/native_mathspec_experiments/native_probe.py
      - name: Original upstream test suite
        if: always()
        working-directory: mathspec-src
        run: pixi run --locked -e py313 pytest -q
      - name: Original R1 regression, no changes
        if: always()
        working-directory: mathspec-src
        run: |
          cd ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1/../BUNDLE_ML_04A_R1
          ../BUNDLE_ML_04A_MS1/native_mathspec_experiments/run_r1.sh
