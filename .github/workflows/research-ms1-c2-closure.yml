name: C2 targeted semantic closure
on:
  pull_request:
    branches: [research/bundle-ml-04a-ms1-c2-consolidation]
    paths:
      - 'Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C2/**'
      - '.github/workflows/research-ms1-c2-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'research/bundle-ml-04a-ms1-c2-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: energy-models/mathspec
          ref: 5f1464c334c1012cdee2947d4d55b4d1d6bef40a
          path: mathspec-src
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned mathspec and original R1 validator
        working-directory: mathspec-src
        run: |
          test "$(git rev-parse HEAD)" = 5f1464c334c1012cdee2947d4d55b4d1d6bef40a
          test "$(git rev-parse HEAD^{tree})" = 635a594392e990e2e22393d408cc5b307704cda0
          echo '4dc324582e4cc4d701cac688026c252c4880634a7d34a7642c99248be05927d2  pixi.lock' | sha256sum -c -
          echo 'e35e688c294c0986a9333895f98400b734d82a5c63db45dc9da308bb82383093  src/mathspec/_canonical.py' | sha256sum -c -
          test "$(git hash-object src/mathspec/_canonical.py)" = a8487b60f03839fc622834ffcaf76e1f9c99f6e9
          test "$(git hash-object pixi.lock)" = dcf89e3e6b3794a1ae79d00a07978ceaec37daba
          cd ..
          test "$(git hash-object Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/../BUNDLE_ML_04A_R1/pinned/csnf_validator.py)" = 5201bda3c0a611d27e2bc335bbfebc191f252ec7
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          manifest-path: mathspec-src/pixi.toml
          environments: py313
          locked: true
          cache: false
      - name: Actual same-fixture comparative experiment
        working-directory: mathspec-src
        run: |
          pixi run --locked -e py313 python --version
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/comparative_canonical/run_comparison.py
      - name: Controlled semantic ablation and falsification probes
        if: always()
        working-directory: mathspec-src
        run: pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/comparative_canonical/ablation_controls.py
      - name: Unchanged canonical closure regressions
        if: always()
        working-directory: mathspec-src
        run: |
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/canonical_closure/test_closure.py
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/canonical_closure/test_package_interface.py
      - name: Original R1 tests
        if: always()
        run: |
          cd Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/../BUNDLE_ML_04A_R1
          ../BUNDLE_ML_04A_MS1/native_mathspec_experiments/run_r1.sh
      - name: C2 shared and workstream tests
        if: always()
        working-directory: mathspec-src
        run: |
          set -euo pipefail
          pixi run --locked -e py313 python -c "import sys; assert sys.version_info[:3]==(3,13,15); print(sys.version)"
          for f in test_interface.py WS_A/test_contract.py WS_B/test_methods.py WS_B/test_original_profiles.py test_integrated.py; do
            if test -f ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C2/$f; then pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C2/$f; fi
          done
      - name: Targeted C2 closure validation
        if: always()
        working-directory: mathspec-src
        run: |
          set -euo pipefail
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C2/closure_v1/test_closure_v1.py
      - name: Original foundation and MS1 probes and method pairs
        if: always()
        working-directory: mathspec-src
        run: |
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/WS_A_mathematical_foundation/tests/test_foundation.py
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/canonical_first_experiment/test_canonical_first.py
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1/native_mathspec_experiments/native_probe.py
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1/architecture_prototypes/experiment.py
      - name: Frozen independent analytical reference corpus (not full A/B paths)
        if: always()
        working-directory: mathspec-src
        run: |
          test "$(git -C .. hash-object Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/WS_B_original_reference_corpus/independent_oracles/oracles.py)" = 4ecf322c5522721dd463f0c6a465d982a94f2c22
          pixi run --locked -e py313 python ../Modelling_Language/study_contract_language/workstreams/BUNDLE_ML_04A_MS1_C1/WS_B_original_reference_corpus/regression_runner/run.py --output /tmp/c2-oracle.json
      - name: Full pinned upstream mathspec suite after integration seam changes
        if: always()
        working-directory: mathspec-src
        run: pixi run --locked -e py313 pytest -q
      - name: Original P5 pinned oracle
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eaea6dd99b736f2560866abda722cde78b908bce
          path: p5-src
          persist-credentials: false
      - name: P5 domain oracle not full-chain
        if: always()
        working-directory: p5-src
        run: |
          test "$(git rev-parse HEAD)" = eaea6dd99b736f2560866abda722cde78b908bce
          test "$(git hash-object Modelling_Language/study_contract_language/workstreams/ML_C24_P5_cba_general_language_stress/tools/cba_stress_oracle.js)" = ef2c7fa4ea4deab919f0c84ac7020aa1a32ff0a2
          node -e 'const r=require("./Modelling_Language/study_contract_language/workstreams/ML_C24_P5_cba_general_language_stress/tools/cba_stress_oracle.js").runSuite();console.log("P5_ORIGINAL="+JSON.stringify(r));if(r.passed!==r.total)process.exit(1)'
